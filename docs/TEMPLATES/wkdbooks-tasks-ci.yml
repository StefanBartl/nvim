# TEMPLATE -- belongs in the tasks-vault repo as `.github/workflows/tasks-ci.yml`
# (the vault is that repo's root; it moved out of WKDBooks on 2026-10-12). It is kept here,
# next to the wrapper it runs (`scripts/tasks-ci.lua` of the nvim config repo, which hands over
# to the engine in the plugin `tasks.nvim`), until it is copied over. NOTE: the `tasks.nvim` checkout below
# works only once that repo is published.
#
# The gate: `tasks check` (no error finding), `tasks index --check` (no outdated
# ROADMAP/TASKS.md) and the vault's md_lint over every generated index. It writes nothing.
#
# Layout it builds, so that `$REPOS_DIR/...` links in the notes and the engine's own
# vault lookup (`$REPOS_DIR/tasks-vault`) resolve like on a dev machine:
#
#   deps/tasks-vault this repo       deps/nvim      the config with scripts/tasks-ci.lua
#   deps/tasks.nvim the engine
#   deps/lib.nvim   the engine's library             deps/lsp.nvim  `lsp.core.env_links` for md_lint
#
# The tasks-vault repo is private, and so may be others below; for a private one pass
# `token: ${{ secrets.<PAT> }}` to its checkout (the default GITHUB_TOKEN reaches only this repository).

name: tasks-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vault-gate:
    name: tasks check + index --check + md_lint
    runs-on: ubuntu-latest
    env:
      REPOS_DIR: ${{ github.workspace }}/deps
    steps:
      - uses: actions/checkout@v5
        with:
          path: deps/tasks-vault
      - uses: actions/checkout@v5
        with:
          repository: StefanBartl/nvim
          path: deps/nvim
      - uses: actions/checkout@v5
        with:
          repository: StefanBartl/tasks.nvim
          path: deps/tasks.nvim
      - uses: actions/checkout@v5
        with:
          repository: StefanBartl/lib.nvim
          path: deps/lib.nvim
          ref: ci-verified
      - uses: actions/checkout@v5
        with:
          repository: StefanBartl/lsp.nvim
          path: deps/lsp.nvim
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - name: Vault gate
        env:
          LIB_NVIM_DIR: ${{ github.workspace }}/deps/lib.nvim
          TASKS_NVIM_DIR: ${{ github.workspace }}/deps/tasks.nvim
          # tasks.nvim refuses to run a vault's own md_lint.lua unless told to. This is the author's own
          # vault repo (pushes by the author), so its script is trusted; a workflow that builds pull requests of
          # strangers must drop this line and pass --md-lint=<a copy outside the vault> instead.
          TASKS_TRUST_VAULT_LINT: "1"
        run: |
          nvim --headless -u NONE -l deps/nvim/scripts/tasks-ci.lua \
            --vault="$REPOS_DIR/tasks-vault"
