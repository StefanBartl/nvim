day_id: "day_04"
program_id: "B1_powershell_echo"
iteration: 1
platform: "powershell"

exercises:
  - id: "ex_04_01_out_file"
    title: "Out-File und Append (PowerShell)"
    duration: "5min"
    difficulty: 2
    points_max: 100
    tags: ["powershell", "output", "file"]

    task:
      description: |
        Schreibe "hello world" in out.txt
        Hänge "second line" an

        Nutze Out-File mit -Append Parameter

    solution:
      primary: |
        "hello world" | Out-File out.txt
        "second line" | Out-File out.txt -Append

      alternatives:
        - |
          Write-Output "hello world" | Out-File out.txt
          Write-Output "second line" | Out-File out.txt -Append

    validation:
      type: "file_content"
      file: "out.txt"
      expected: |
        hello world
        second line

  - id: "ex_04_02_write_output"
    title: "Write-Output vs echo"
    duration: "5min"
    difficulty: 1
    points_max: 100
    tags: ["powershell", "output"]

    task:
      description: |
        Nutze Write-Output um "Hello PowerShell" auszugeben
        Speichere in greeting.txt

    solution:
      primary: 'Write-Output "Hello PowerShell" | Out-File greeting.txt'

  - id: "ex_04_03_variables"
    title: "PowerShell Variablen"
    duration: "5min"
    difficulty: 2
    points_max: 100

    task:
      description: |
        Erstelle Variable $Name mit deinem Namen
        Gib "Hello $Name" aus und speichere in result.txt

    solution:
      primary: |
        $Name = "Stefan"
        "Hello $Name" | Out-File result.txt
