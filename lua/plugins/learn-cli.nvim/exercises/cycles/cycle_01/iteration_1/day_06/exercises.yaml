day_id: "day_06"
program_id: "B3_powershell_find"
iteration: 1
platform: "powershell"

setup:
  structure:
    - "test-dir/"
    - "test-dir/file1.txt"
    - "test-dir/file2.log"
    - "test-dir/sub/"
    - "test-dir/sub/file3.txt"

exercises:
  - id: "ex_06_01_get_childitem"
    title: "Get-ChildItem rekursiv"
    duration: "5min"
    difficulty: 2
    points_max: 100
    tags: ["powershell", "get-childitem", "recursive"]

    task:
      description: |
        Finde alle .txt Dateien in test-dir/ rekursiv

        Nutze Get-ChildItem mit:
        • -Recurse für rekursive Suche
        • -Filter für Pattern

    solution:
      primary: 'Get-ChildItem -Path test-dir -Recurse -Filter *.txt'

      alternatives:
        - 'Get-ChildItem test-dir -Recurse -Include *.txt'
        - 'Get-ChildItem -Path test-dir -Recurse | Where-Object {$_.Extension -eq ".txt"}'

    validation:
      type: "command_success"
      command: 'Get-ChildItem -Path test-dir -Recurse -Filter *.txt'

  - id: "ex_06_02_where_object"
    title: "Where-Object für Größenfilter"
    duration: "5min"
    difficulty: 3
    points_max: 100

    task:
      description: |
        Finde alle Dateien größer als 0 Bytes

        Nutze Where-Object mit Length-Property:
        Where-Object Length -gt 0

    solution:
      primary: 'Get-ChildItem test-dir -Recurse -File | Where-Object Length -gt 0'

      alternatives:
        - 'Get-ChildItem test-dir -Recurse -File | Where-Object {$_.Length -gt 0}'

    hints:
      - level: 1
        cost: 10
        text: |
          Get-ChildItem liefert Objekte mit Properties.
          Where-Object filtert basierend auf Properties.

          -File zeigt nur Dateien (keine Verzeichnisse)

      - level: 2
        cost: 20
        text: |
          Syntax:
          Get-ChildItem ... | Where-Object Length -gt 0

          -gt = greater than (größer als)

  - id: "ex_06_03_foreach"
    title: "ForEach-Object (-exec Äquivalent)"
    duration: "5min"
    difficulty: 3
    points_max: 150

    task:
      description: |
        Finde alle .log Dateien
        Zähle Zeilen pro Datei

        Nutze ForEach-Object mit:
        (Get-Content $_).Count

    solution:
      primary: 'Get-ChildItem test-dir -Recurse -Filter *.log | ForEach-Object { (Get-Content $_.FullName).Count }'

      alternatives:
        - 'Get-ChildItem test-dir -Recurse -Filter *.log | ForEach-Object { "$($_.Name): $((Get-Content $_).Count) lines" }'

    hints:
      - level: 1
        cost: 15
        text: |
          ForEach-Object führt einen Scriptblock für jedes Objekt aus.
          $_ ist das aktuelle Objekt in der Pipeline.

          Get-Content liest Dateiinhalt
          .Count gibt Anzahl Zeilen zurück

      - level: 2
        cost: 30
        text: |
          Schema:
          Get-ChildItem ... | ForEach-Object {
              (Get-Content $_.FullName).Count
          }

      - level: 3
        cost: 45
        text: |
          Lösung:
          Get-ChildItem test-dir -Recurse -Filter *.log | ForEach-Object { (Get-Content $_.FullName).Count }
