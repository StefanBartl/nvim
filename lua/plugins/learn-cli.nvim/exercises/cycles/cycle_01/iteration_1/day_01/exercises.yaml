day_id: "day_01"
program_id: "A1_echo"
iteration: 1
platform: "linux"

setup:
  files:
    - name: "input.txt"
      content: |
        alpha
        beta
        gamma

exercises:
  # ===================================================================
  # Exercise 1: Redirect und Append
  # ===================================================================
  - id: "ex_01_01_redirect"
    title: "Redirect und Append"
    duration: "5min"
    difficulty: 1
    points_max: 100
    tags: ["echo", "redirect", "append", "basics"]

    task:
      description: |
        Schreibe den Text "hello world" in die Datei out.txt
        Hänge dann den Text "second line" an dieselbe Datei an

        Nutze:
        - '>' zum Überschreiben
        - '>>' zum Anhängen

      expected_result: |
        Die Datei out.txt sollte enthalten:
        hello world
        second line

      hints_before_start:
        - "Zwei separate echo-Befehle sind nötig"
        - "Achte auf den Unterschied zwischen > und >>"

    solution:
      primary: |
        echo "hello world" > out.txt
        echo "second line" >> out.txt

      alternatives:
        - 'echo "hello world" > out.txt; echo "second line" >> out.txt'
        - |
          echo "hello world" > out.txt
          echo "second line" >> out.txt

    validation:
      type: "file_content"
      file: "out.txt"
      expected: |
        hello world
        second line
      checks:
        - type: "file_exists"
          file: "out.txt"
        - type: "line_count"
          file: "out.txt"
          expected: 2

    scoring:
      correct: 100
      time_bonus:
        "30": 20
        "60": 10
        "90": 5
      hint_penalty:
        "1": -10
        "2": -20
        "3": -30
        viewed_solution: -50

    hints:
      - level: 1
        cost: 10
        type: "concept"
        text: |
          Du brauchst zwei Befehle:
          1. Einen zum Schreiben (überschreiben) mit '>'
          2. Einen zum Anhängen mit '>>'

      - level: 2
        cost: 20
        type: "syntax"
        text: |
          Die Syntax ist:
          echo "TEXT" > DATEI    # überschreiben
          echo "TEXT" >> DATEI   # anhängen

      - level: 3
        cost: 30
        type: "partial"
        text: |
          Erster Befehl:
          echo "hello world" > out.txt

          Jetzt musst du nur noch die zweite Zeile anhängen...

      - level: 4
        cost: 50
        type: "solution"
        text: |
          Vollständige Lösung:
          echo "hello world" > out.txt
          echo "second line" >> out.txt

    feedback:
      success:
        perfect: |
          🎉 Perfekt! Du hast beide Redirections korrekt verwendet.

          Wichtig:
          • '>' überschreibt eine Datei komplett
          • '>>' hängt an eine existierende Datei an

          Nächstes Ziel: Pipes mit tee!

        with_hints: |
          ✅ Geschafft mit Hints!

          Merke dir:
          • '>' = überschreiben
          • '>>' = anhängen

          Beim nächsten Mal versuch es ohne Hints!

      errors:
        file_missing: |
          ❌ Die Datei 'out.txt' wurde nicht erstellt.

          Prüfe:
          - Hast du den echo-Befehl ausgeführt?
          - Hast du '>' verwendet?

        content_wrong: |
          ❌ Die Datei existiert, aber der Inhalt stimmt nicht.

          Tipp: Prüfe ob du '>>' für die zweite Zeile verwendet hast.
          Mit '>' würdest du die Datei überschreiben!

        only_one_line: |
          ❌ Nur eine Zeile gefunden. Die zweite Zeile fehlt.

          Hast du '>>' für die zweite Zeile verwendet?

  # ===================================================================
  # Exercise 2: Tee mit Pipe
  # ===================================================================
  - id: "ex_01_02_tee"
    title: "Output duplizieren mit tee"
    duration: "5min"
    difficulty: 2
    points_max: 100
    tags: ["echo", "pipe", "tee", "intermediate"]

    task:
      description: |
        Zeige den Inhalt von input.txt auf dem Bildschirm
        UND schreibe ihn gleichzeitig in die Datei copy.txt

        Nutze dafür den Befehl 'tee'

      expected_result: |
        - Bildschirm zeigt:
          alpha
          beta
          gamma

        - Datei copy.txt enthält:
          alpha
          beta
          gamma

    solution:
      primary: "cat input.txt | tee copy.txt"

      alternatives:
        - "tee copy.txt < input.txt"
        - "cat input.txt | tee copy.txt | cat"
        - "< input.txt tee copy.txt"

    validation:
      type: "multi"
      checks:
        - type: "file_exists"
          file: "copy.txt"

        - type: "file_content"
          file: "copy.txt"
          expected_from_file: "input.txt"

    scoring:
      correct: 100
      time_bonus:
        "30": 20
        "60": 10
      hint_penalty:
        "1": -10
        "2": -20
        "3": -30
        viewed_solution: -50

    hints:
      - level: 1
        cost: 10
        type: "concept"
        text: |
          'tee' ist wie ein T-Stück:
          - Input kommt rein
          - Output geht an stdout (Bildschirm)
          - UND gleichzeitig in eine Datei

      - level: 2
        cost: 20
        type: "syntax"
        text: |
          Das Schema ist:
          cat QUELLE | tee ZIEL

          tee liest von stdin (Pipe) und schreibt nach stdout + Datei

      - level: 3
        cost: 30
        type: "solution"
        text: |
          Lösung:
          cat input.txt | tee copy.txt

    feedback:
      success:
        perfect: |
          ✅ Exzellent! Du hast tee gemeistert.

          tee ist nützlich wenn du:
          • Output sehen UND speichern willst
          • In mehrere Dateien schreiben willst: tee file1 file2
          • Mit -a anhängen willst: tee -a file.txt

        with_hints: |
          ✅ Gut gemacht!

          tee = "T-Stück" für Output
          → stdout + Datei(en) gleichzeitig

  # ===================================================================
  # Exercise 3: Variablen
  # ===================================================================
  - id: "ex_01_03_variables"
    title: "Shell-Variablen nutzen"
    duration: "5min"
    difficulty: 2
    points_max: 100
    tags: ["echo", "variables", "expansion"]

    task:
      description: |
        Erstelle eine Variable NAME mit deinem Namen
        Gib dann "Hello $NAME" aus
        Speichere die Ausgabe in greeting.txt

      expected_result: |
        Die Datei greeting.txt sollte enthalten:
        Hello [Dein Name]

        (wobei [Dein Name] der Wert deiner Variable ist)

    solution:
      primary: |
        NAME="Stefan"
        echo "Hello $NAME" > greeting.txt

      flexible: true
      pattern: "^Hello \\w+$"

      alternatives:
        - |
          NAME="Max"
          echo "Hello $NAME" > greeting.txt
        - |
          export NAME="Julia"
          echo "Hello $NAME" > greeting.txt

    validation:
      type: "pattern"
      file: "greeting.txt"
      regex: "^Hello \\w+$"
      forbidden_literal: "$NAME"

    scoring:
      correct: 100
      time_bonus:
        "30": 20
        "60": 10
      hint_penalty:
        "1": -10
        "2": -20
        "3": -30
        viewed_solution: -50

    hints:
      - level: 1
        cost: 10
        type: "concept"
        text: |
          In Bash/Zsh kannst du Variablen so setzen:
          VARNAME="wert"

          Und so verwenden:
          echo "$VARNAME"

      - level: 2
        cost: 20
        type: "syntax"
        text: |
          Zwei Schritte:
          1. NAME="DeinName"
          2. echo "Hello $NAME" > greeting.txt

          Wichtig: $ vor dem Variablennamen beim Nutzen!

      - level: 3
        cost: 30
        type: "solution"
        text: |
          Beispiel-Lösung:
          NAME="Stefan"
          echo "Hello $NAME" > greeting.txt

          Du kannst natürlich einen anderen Namen verwenden!

    feedback:
      success:
        perfect: |
          🎯 Perfect! Variablen-Expansion verstanden!

          Wichtige Konzepte:
          • Setzen: VAR="wert" (ohne $)
          • Nutzen: $VAR oder ${VAR}
          • Quotes: "..." erlaubt Expansion, '...' nicht

          Beispiel:
          echo "$NAME"  → expandiert
          echo '$NAME'  → literal $NAME

        with_hints: |
          ✅ Variablen funktionieren!

          Merke: $ nur beim NUTZEN, nicht beim SETZEN
