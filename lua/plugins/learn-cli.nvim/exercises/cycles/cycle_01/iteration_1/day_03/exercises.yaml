day_id: "day_03"
program_id: "A3_find"
iteration: 1
platform: "linux"

setup:
  structure:
    - "find-test/"
    - "find-test/file1.txt"
    - "find-test/file2.log"
    - "find-test/readme.md"
    - "find-test/.hidden.txt"
    - "find-test/sub/"
    - "find-test/sub/file3.txt"
    - "find-test/sub/file4.log"
    - "find-test/sub/data.csv"

exercises:
  # ===================================================================
  # Exercise 1: Nach Name und Typ filtern
  # ===================================================================
  - id: "ex_03_01_name_type"
    title: "Dateien nach Name finden"
    duration: "5min"
    difficulty: 2
    points_max: 100
    tags: ["find", "name", "type", "basics"]

    task:
      description: |
        Finde alle .txt Dateien im Verzeichnis find-test/
        (auch in Unterverzeichnissen)

        Nutze:
        • -name für das Pattern
        • -type f für nur Dateien (keine Verzeichnisse)

      expected_result: |
        Sollte finden:
        find-test/file1.txt
        find-test/.hidden.txt
        find-test/sub/file3.txt

    solution:
      primary: 'find find-test -type f -name "*.txt"'

      alternatives:
        - 'find find-test -name "*.txt" -type f'
        - "find find-test -type f -name '*.txt'"
        - 'find ./find-test -type f -name "*.txt"'

    validation:
      type: "command_output_unordered"
      command: 'find find-test -type f -name "*.txt"'
      expected_lines:
        - "find-test/file1.txt"
        - "find-test/.hidden.txt"
        - "find-test/sub/file3.txt"

    scoring:
      correct: 100
      time_bonus:
        "30": 20
        "60": 10
      hint_penalty:
        "1": -10
        "2": -20
        "3": -30
        viewed_solution: -50

    hints:
      - level: 1
        cost: 10
        type: "concept"
        text: |
          find durchsucht Verzeichnisbäume.

          Grundstruktur:
          find VERZEICHNIS [OPTIONS] [TESTS]

          -name verwendet Wildcards (* für beliebige Zeichen)
          -type f bedeutet "nur Dateien"

      - level: 2
        cost: 20
        type: "syntax"
        text: |
          Der Befehl ist:
          find find-test -type f -name "*.txt"

          Wichtig:
          • Wildcards in Quotes! ("*.txt")
          • -type f für nur Dateien
          • Rekursiv ist Standard bei find

      - level: 3
        cost: 30
        type: "solution"
        text: |
          Lösung:
          find find-test -type f -name "*.txt"

    feedback:
      success:
        perfect: |
          ✅ Perfekt! find Grundlagen verstanden.

          Wichtige find-Optionen:
          • -type f : nur Dateien
          • -type d : nur Verzeichnisse
          • -name "pattern" : Name mit Wildcards
          • -iname "pattern" : Name, case-insensitive

          Wildcards:
          • * : beliebige Zeichen
          • ? : genau ein Zeichen
          • [abc] : eines von a, b, c

          Beispiel:
          find . -name "test?.txt"
          → test1.txt, test2.txt, aber nicht test10.txt

  # ===================================================================
  # Exercise 2: Nach Größe filtern
  # ===================================================================
  - id: "ex_03_02_size"
    title: "Dateien nach Größe filtern"
    duration: "5min"
    difficulty: 2
    points_max: 100
    tags: ["find", "size", "filter"]

    task:
      description: |
        Finde alle Dateien im Verzeichnis find-test/
        die größer als 0 Bytes sind

        Nutze: -size +0c
        (c = bytes, + = größer als)

      expected_result: |
        Sollte alle nicht-leeren Dateien finden

    solution:
      primary: "find find-test -type f -size +0c"

      alternatives:
        - "find find-test -size +0c -type f"
        - "find find-test -type f -size +0"

    validation:
      type: "command_success"
      command: "find find-test -type f -size +0c"

    scoring:
      correct: 100
      time_bonus:
        "30": 20
        "60": 10
      hint_penalty:
        "1": -10
        "2": -20
        "3": -30
        viewed_solution: -50

    hints:
      - level: 1
        cost: 10
        type: "concept"
        text: |
          -size filtert nach Dateigröße:
          • +N : größer als N
          • -N : kleiner als N
          • N  : genau N

          Einheiten:
          • c : bytes
          • k : kilobytes
          • M : megabytes
          • G : gigabytes

      - level: 2
        cost: 20
        type: "syntax"
        text: |
          Der Befehl ist:
          find find-test -type f -size +0c

          +0c = größer als 0 bytes

      - level: 3
        cost: 30
        type: "solution"
        text: |
          Lösung:
          find find-test -type f -size +0c

    feedback:
      success:
        perfect: |
          🎯 Gut! Größenfilter verstanden.

          Weitere Beispiele:
          • -size +10M : größer als 10 MB
          • -size -1k : kleiner als 1 KB
          • -size 100c : genau 100 bytes

          Kombiniert:
          find . -type f -size +1M -size -10M
          → Dateien zwischen 1 und 10 MB

  # ===================================================================
  # Exercise 3: Exec - Befehl auf Ergebnisse anwenden
  # ===================================================================
  - id: "ex_03_03_exec"
    title: "Exec - Befehle ausführen"
    duration: "5min"
    difficulty: 3
    points_max: 150
    tags: ["find", "exec", "advanced"]

    task:
      description: |
        Finde alle .log Dateien in find-test/
        Zähle für jede Datei die Anzahl der Zeilen mit wc -l

        Nutze:
        • -name "*.log"
        • -exec wc -l {} \;

        {} wird durch den Dateinamen ersetzt
        \; beendet den -exec Befehl

      expected_result: |
        Sollte für jede .log Datei die Zeilenanzahl ausgeben

    solution:
      primary: 'find find-test -name "*.log" -exec wc -l {} \;'

      alternatives:
        - 'find find-test -type f -name "*.log" -exec wc -l {} \;'
        - 'find find-test -name "*.log" -exec wc -l {} +'

    validation:
      type: "command_contains"
      command: 'find find-test -name "*.log" -exec wc -l {} \;'
      must_contain:
        - ".log"

    scoring:
      correct: 150
      time_bonus:
        "45": 25
        "90": 15
      hint_penalty:
        "1": -15
        "2": -30
        "3": -45
        viewed_solution: -75

    hints:
      - level: 1
        cost: 15
        type: "concept"
        text: |
          -exec führt einen Befehl für jedes Ergebnis aus.

          Syntax:
          -exec BEFEHL {} \;

          • {} wird durch den Dateinamen ersetzt
          • \; beendet den exec-Befehl (muss escaped werden!)

      - level: 2
        cost: 30
        type: "syntax"
        text: |
          Der Befehl ist:
          find find-test -name "*.log" -exec wc -l {} \;

          Schritt für Schritt:
          1. find find-test -name "*.log" → findet .log Dateien
          2. -exec wc -l {} → zählt Zeilen pro Datei
          3. \; → beendet -exec

      - level: 3
        cost: 45
        type: "solution"
        text: |
          Lösung:
          find find-test -name "*.log" -exec wc -l {} \;

    feedback:
      success:
        perfect: |
          🏆 Hervorragend! -exec gemeistert!

          -exec ist sehr mächtig:
          • {} wird durch jeden Fund ersetzt
          • \; führt Befehl pro Datei aus
          • + führt Befehl mit allen Dateien aus

          Beispiele:
          # Alle .txt löschen (VORSICHT!)
          find . -name "*.txt" -exec rm {} \;

          # Alle .jpg nach backup/ kopieren
          find . -name "*.jpg" -exec cp {} backup/ \;

          # Mit + (effizienter, ein Aufruf):
          find . -name "*.log" -exec wc -l {} +

          # Mit xargs (noch besser für viele Dateien):
          find . -name "*.log" | xargs wc -l

        with_hints: |
          ✅ -exec funktioniert!

          Wichtig:
          • {} = Platzhalter für Dateinamen
          • \; = Ende des -exec Befehls
          • + statt \; = batch mode (schneller)
