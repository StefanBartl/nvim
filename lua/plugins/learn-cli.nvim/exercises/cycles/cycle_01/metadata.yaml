metadata:
  cycle_id: "cycle_01"
  title: "CLI Basics: echo, grep, find"
  category: "basics"
  version: "1.0.0"
  platforms:
    - "linux"
    - "macos"
  iterations: 3
  days_per_cycle: 6
  duration_per_day: "15min"

  objectives:
    - "Master echo output redirection (>, >>, |, tee)"
    - "Use grep for text searching with patterns and flags"
    - "Find files efficiently with filters and exec"
    - "Learn PowerShell equivalents for cross-platform work"

  prerequisites:
    - "Basic terminal navigation"
    - "Understanding of files and directories"

  tags:
    - "cli"
    - "bash"
    - "shell"
    - "fundamentals"

  estimated_total_time: "90min"

  progression:
    iteration_1:
      difficulty: "beginner"
      focus: "Basic flags and common use cases"
      new_concepts:
        - "Output redirection basics"
        - "Simple text search"
        - "File finding by name"

    iteration_2:
      difficulty: "intermediate"
      focus: "Flag combinations and complex scenarios"
      new_concepts:
        - "Multiple redirections"
        - "Regex patterns"
        - "Time-based file search"

    iteration_3:
      difficulty: "advanced"
      focus: "Edge cases and performance"
      new_concepts:
        - "Process substitution"
        - "Perl-compatible regex"
        - "Complex find expressions"
